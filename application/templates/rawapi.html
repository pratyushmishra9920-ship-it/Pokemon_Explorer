{% extends "base.html" %}

{% block title %}
    Raw API
{% endblock %}

{% block content %}

    <style>
        .result {
            margin: 50px auto 0;
            text-align: left;
            width: 100%;
            max-width: 900px;
        }

        .result h2 {
            font-size: 42px;
            text-align: left;
            margin-bottom: 10px;
        }

        .result pre {
            background-color: #212529;
            padding: 20px;
            border-radius: 10px;
            font-size: 16px;
            line-height: 1.6;
            overflow-x: auto;
            width: 100%;
            box-sizing: border-box;
        }
        .result-second-control {
            width: 100%;
            margin: 0 auto;
            text-align: center;
        }

        .result-second-control code {
            display: inline-block;
            text-align: left;
        }
    </style>

    <div class="result">
        <h2>PokéAPI Endpoint</h2>
        <pre>{{ result1 }}</pre>
        <h2>Raw API Response</h2>
        <pre class="result-second-control"><code>{{ result2 }}</code></pre>
    </div>

{% endblock %}
