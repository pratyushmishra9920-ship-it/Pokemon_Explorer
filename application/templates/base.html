<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>
       
        {% block title %}

        {% endblock %}

    </title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

    <style>
        body {
            background-color:#343A40;
            color: white;
        }
        .navbar .navbar-nav {
            margin-left: 40px !important;
        }
        .character-link {
            margin-left: 35px;
        }
        .nav-link {
           color: #E2E8F0 !important;
        }
    </style>

  </head>
  <body>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

      <nav class="navbar navbar-expand-md navbar-dark bg-dark px-4">
      <a class="navbar-brand" href="{{ url_for('main') }}">Pokemon Explorer</a>
      <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav">
            <li class="nav-item active">
                <a class="nav-link" href="{{ url_for('main') }}">Home</a>
            </li>
            <li class="nav-item character-link">
                <a class="nav-link" href="{{ url_for('info') }}">Pokemon Character's</a>
            </li>
        </ul>
      </div>
    </nav>

    {% block content %}
      

    {% endblock %}

  </body>
</html>
